[workspace]
members = ["crates/widgetz-core", "crates/widgetz-tauri", "src-tauri"]
resolver = "2"
[workspace.package]
version = "0.6.0"
edition = "2024"
license = "MIT"
[workspace.dependencies]
serde = {version="1",features=["derive"]}
serde_json = "1"
tauri = {version="2",features=["macos-private-api"]}
widgetz-core = {path="crates/widgetz-core"}
widgetz-tauri = {path="crates/widgetz-tauri"}
